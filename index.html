function best(){let b=0,n=0;for(let d=1;d<=N;d++){n=full(d)?n+1:0;b=Math.max(b,n)}return b}
const mins=d=>P[d-1][2].reduce((s,g)=>s+g[3],0);
function ring(p){const c=263.9;return `<svg width="84" height="84" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="10"/><circle cx="50" cy="50" r="42" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">${Math.round(p*100)}%</text></svg>`}
const link=c=>`<a class="cl" href="${CO[c][1]}" target="_blank" rel="noopener">📚 Udemy: ${CO[c][0]} ↗</a>`;
function chips(g){if(!g)return"";if(g[4]==2&&g[1]>=0)return `<span class="ch"><i>${CAT[g[1]]}</i><i class="l${g[2]}">${LV[g[2]]}</i><i>~${g[3]} min</i></span>`;if(g[4]==3)return `<span class="ch"><i class="cn">Course</i><i>~${g[3]} min</i></span>`;if(g[4]==1)return `<span class="ch"><i class="cn">Understand</i></span>`;return""}
function view(){let h="";
if(tab=="today"){const d=cur(),[a,b]=st(d),p=b?a/b:0,w=Math.ceil(d/7),c=P[d-1][1];
h=`<section class="hero"><div><div class="k">Day ${d} of ${N} · ${WK[w-1]}</div><h1>${P[d-1][0]}</h1><div class="k">📅 ${fd(d)}${iso(dt(d))==iso(new Date())?" · Today":""}</div><div class="k">About ${mins(d)} min planned</div></div>${ring(p)}</section>
${p==1?'<div class="card win">🎉 All goals done today. Great work!</div>':''}${c>=0?link(c):""}
<div class="card row"><button data-a="prev">‹ Prev</button><button data-a="auto">Today</button><button data-a="next">Next ›</button></div>
<div class="card"><h2>Goals for this day (${a}/${b})</h2>${gl(d).map(x=>`<label class="g ${S.done[x[1]]?"on":""}"><input type="checkbox" data-k="${x[1]}" ${S.done[x[1]]?"checked":""}><span class="bx"></span><span class="t">${x[2]&&x[2][4]==1?"📘 ":""}${x[0]}${chips(x[2])}</span>${x[2]?"":`<button class="x" data-x="${x[1]}">×</button>`}</label>`).join("")}</div>
<div class="card row"><input type="text" id="nt" placeholder="Add your own goal for this day" maxlength="120"><button class="p" data-a="add">Add</button></div>`}
if(tab=="plan"){h="<h1>8-week plan</h1><p class=m>Weeks 1 to 4: learn the concepts. Weeks 5 to 8: practice and build.</p>"+WK.map((n,k)=>{let a=0,b=0,ds=[];for(let d=k*7+1;d<=k*7+7;d++){const s=st(d);a+=s[0];b+=s[1];ds.push(d)}
return `<div class="card"><div class="row"><b>Week ${k+1} · ${n}</b><span class="m">${a}/${b}</span></div><div class="m">📅 ${fd(k*7+1,sh)} – ${fd(k*7+7,sh)}</div>${k<4?`<a href="${CO[k][1]}" target="_blank" rel="noopener" class="m">📚 ${CO[k][0]} ↗</a>`:""}<div class="bar"><i style="width:${b?100*a/b:0}%"></i></div><div class="pills">${ds.map(d=>{const s=st(d);return `<button class="pill ${s[0]==s[1]?"f":s[0]?"h":""} ${d==cur()?"c":""}" data-d="${d}">${d}<small>${fd(d,sh)}</small></button>`}).join("")}</div></div>`}).join("")}
if(tab=="stats"){let a=0,b=0,dn=0,cd=CAT.map(()=>0),ct=CAT.map(()=>0),td=0,tt=0;for(let d=1;d<=N;d++){const s=st(d);a+=s[0];b+=s[1];if(full(d))dn++;P[d-1][2].forEach((g,i)=>{const k=S.done[d+"."+i]?1:0;if(g[4]==1){tt++;td+=k}if(g[4]==2&&g[1]>=0){ct[g[1]]++;cd[g[1]]+=k}})}
h=`<h1>Your progress</h1><div class="stats"><div class="stat"><b>🔥 ${streak()}</b><span class="m">Current streak</span></div><div class="stat"><b>🏆 ${best()}</b><span class="m">Best streak</span></div><div class="stat"><b>${dn}/${N}</b><span class="m">Days completed</span></div><div class="stat"><b>${b?Math.round(100*a/b):0}%</b><span class="m">Goals done (${a}/${b})</span></div></div>
<div class="card"><h2>Concepts understood</h2><div class="row"><span>Topics</span><span class="m">${td}/${tt}</span></div><div class="bar"><i style="width:${tt?100*td/tt:0}%"></i></div><h2 style="margin-top:12px">Questions solved</h2>${CAT.map((c,i)=>`<div class="row"><span>${c}</span><span class="m">${cd[i]}/${ct[i]}</span></div><div class="bar"><i style="width:${ct[i]?100*cd[i]/ct[i]:0}%"></i></div>`).join("")}</div>
<div class="card row"><span>Plan start date</span><input type="date" id="sd" value="${S.start}"></div><p class="m">Plan runs from ${fd(1)} to ${fd(N)}.</p><p class="m">Goals and ticks save automatically on this device. Open the app from the same place every time, and avoid clearing site data.</p>`}
app.innerHTML=h;nav.innerHTML=[["today","Today"],["plan","Plan"],["stats","Stats"]].map(t=>`<button data-t="${t[0]}" class="${tab==t[0]?"on":""}">${t[1]}</button>`).join("")}
document.addEventListener("click",e=>{const x=e.target.closest("[data-x]");if(x){e.preventDefault();const k=x.dataset.x,d=+k.split(".")[0];S.cust[d]=(S.cust[d]||[]).filter(c=>d+".c"+c.id!=k);delete S.done[k];save();view();return}
const b=e.target.closest("button");if(!b)return;
if(b.dataset.t){tab=b.dataset.t;view();scrollTo(0,0);return}
if(b.dataset.d){S.day=+b.dataset.d;tab="today";save();view();scrollTo(0,0);return}
const a=b.dataset.a;if(!a)return;
if(a=="prev")S.day=Math.max(1,cur()-1);if(a=="next")S.day=Math.min(N,cur()+1);if(a=="auto")S.day=0;
if(a=="add"){const i=document.getElementById("nt"),t=i.value.trim();if(!t)return;const d=cur();(S.cust[d]=S.cust[d]||[]).push({t:t.replace(/</g,"&lt;"),id:Date.now()})}
save();view()});
document.addEventListener("change",e=>{const t=e.target;
if(t.dataset.k){t.checked?S.done[t.dataset.k]=iso(new Date()):delete S.done[t.dataset.k];save();const y=scrollY;view();scrollTo(0,y)}
if(t.id=="sd"&&t.value){S.start=t.value;S.day=0;save();view()}});
let ls=null;try{ls=localStorage.getItem(KEY)}catch(e){}
idb("get").then(j=>{const a=parse(ls),b=parse(j);const bst=!a?b:!b?a:(b.saved||0)>(a.saved||0)?b:a;if(bst&&bst.done)S=Object.assign(S,bst);if(!S.start){S.start=iso(new Date());save()}view()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></body></html>
